<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151a2b">
<title>Habita · Control</title>
<style>
:root{--bg:#151a2b;--card:#ffffff12;--line:#ffffff1f;--text:#eef0f8;--muted:#aab6ce;--amber:#f0c18b;--on:#ffd9a8}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(ellipse at 20% 0%,#3a3f6b,transparent 60%),var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
body{padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:auto;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header h1{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;background:#8fd6a0;box-shadow:0 0 10px #8fd6a0}.dot.off{background:#ff9d8a;box-shadow:0 0 10px #ff9d8a}
.picture{width:100%;aspect-ratio:16/10;border-radius:18px;background:#0b1020 center/cover no-repeat;border:1px solid var(--line);margin-bottom:12px}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:16px 2px 8px}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 13px}
.chip.active{background:#8fb6ff33;border-color:#c3d7ff55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px 12px;text-align:left;min-height:68px;touch-action:pan-y;user-select:none}
.tile .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--level,0)*100%);background:linear-gradient(90deg,#ffd9a833,#ffd9a81a);pointer-events:none;transition:width .15s}
.tile b{position:relative;display:block;font-weight:600;font-size:13px}.tile span{position:relative;font-size:12px;color:var(--muted)}
.tile.on{border-color:#ffd9a866}.tile.on span{color:var(--on)}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px}
.row .name{flex:1;min-width:0}.row .name small{display:block;color:var(--muted);font-size:12px}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff14;font-size:18px}
.round.on{background:#ffd9a833;border-color:#ffd9a888}
.value{min-width:52px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--amber)}
.empty{color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d3552ee;border:1px solid var(--line);border-radius:14px;padding:10px 16px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.pair{margin:40px 10px;text-align:center;color:var(--muted)}
.mini body,.mini{padding:10px}.mini .picture{aspect-ratio:16/9}
</style>
</head>
<body>
<main id="app"><p class="pair">Conectando con Habita…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// Control remoto de Habita: el mismo panel en la ventanita de la bandeja (habitaRemote) y en el
// celular (HTTP en la red de la casa, con la clave del QR). Usa las órdenes de la app: cada
// cambio pasa por su historial y llega a los equipos reales vinculados.
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const desktop = window.habitaRemote;
if (desktop) document.documentElement.classList.add('mini');
let key = '';
try {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('k');
  if (fromHash) { localStorage.setItem('habita-remote-key', fromHash); history.replaceState(null, '', location.pathname); }
  key = localStorage.getItem('habita-remote-key') || '';
} catch {}
let home = null, room = 'all', busy = false, pictureUrl = '';

async function call(name, args = {}) {
  const reply = desktop ? await desktop.call(name, args) : await (await fetch('/api/tool', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${key}` }, body: JSON.stringify({ name, arguments: args }) })).json();
  if (!reply.ok) throw new Error(reply.error || 'Habita no pudo hacerlo.');
  return reply.result;
}
function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600); }
const degrees = n => `${Number(n).toLocaleString('es-CL', { maximumFractionDigits: 1 })}°`;
const lit = l => l.on && l.brightness > 0;
const inRoom = d => room === 'all' || d.room === room;

async function refresh(picture = false) {
  try {
    home = await call('get_home');
    render();
    if (picture || !pictureUrl) loadPicture();
  } catch (error) {
    $('#app').innerHTML = `<p class="pair">${key || desktop ? esc(error.message) : 'Escanea el código QR que muestra Habita en tu computador para vincular este celular.'}</p>`;
  }
}
async function loadPicture() {
  try {
    const { image } = await call('get_picture');
    pictureUrl = image;
    const el = $('.picture');
    if (el) el.style.backgroundImage = `url("${image}")`;
  } catch {}
}

function render() {
  if (busy) return;
  const lights = home.lights.filter(inRoom), acs = home.airConditioners.filter(inRoom), tvs = home.tvs.filter(inRoom);
  const on = home.lights.filter(lit).length, ac = home.airConditioners.find(a => a.on);
  const rooms = [...new Set([...home.lights, ...home.airConditioners, ...home.tvs].map(d => d.room).filter(Boolean))];
  $('#app').innerHTML = `
   <header><span class="dot ${on || ac ? '' : 'off'}"></span><h1>${esc(home.name)}<small>${on ? `${on} de ${home.lights.length} luces encendidas` : 'Luces apagadas'}${ac ? ` · Aire ${degrees(ac.target)}` : ''}</small></h1>
    <button class="round" id="all-off" aria-label="Apagar todo" title="Apagar todo">⏻</button></header>
   <div class="picture" role="img" aria-label="Maqueta de la casa" style="background-image:url('${pictureUrl}')"></div>
   ${home.scenes.length ? `<h2>Escenas</h2><div class="chips">${home.scenes.map(s => `<button class="chip" data-scene="${esc(s.id)}">${esc(s.name)}</button>`).join('')}</div>` : ''}
   ${rooms.length > 1 ? `<h2>Espacios</h2><div class="chips"><button class="chip ${room === 'all' ? 'active' : ''}" data-room="all">Toda la casa</button>${rooms.map(r => `<button class="chip ${room === r ? 'active' : ''}" data-room="${esc(r)}">${esc(r)}</button>`).join('')}</div>` : ''}
   ${lights.length ? `<h2>Luces</h2><div class="grid">${lights.map(l => `<button class="tile ${lit(l) ? 'on' : ''}" data-light="${esc(l.id)}" style="--level:${lit(l) ? l.brightness / 100 : 0}"><i class="fill"></i><b>${esc(l.name)}</b><span>${lit(l) ? `${l.brightness}%` : 'Apagada'}${l.device.linked && !l.device.available ? ' · sin conexión' : ''}</span></button>`).join('')}</div><p class="empty">Toca para encender o apagar; desliza a los lados para atenuar.</p>` : ''}
   ${acs.length ? `<h2>Climatización</h2>${acs.map(a => `<div class="row"><div class="name">${esc(a.name)}<small>${a.on ? esc(a.mode) : 'Apagado'}${a.device.currentTemperature != null ? ` · ahora ${degrees(a.device.currentTemperature)}` : ''}</small></div>
     <button class="round" data-ac="${esc(a.id)}" data-step="-1" aria-label="Bajar">−</button><span class="value">${degrees(a.target)}</span><button class="round" data-ac="${esc(a.id)}" data-step="1" aria-label="Subir">+</button>
     <button class="round ${a.on ? 'on' : ''}" data-ac-power="${esc(a.id)}" aria-label="Encender o apagar">⏻</button></div>`).join('')}` : ''}
   ${tvs.length ? `<h2>Televisores</h2>${tvs.map(t => `<div class="row"><div class="name">${esc(t.name)}<small>${t.on ? `Volumen ${t.volume}%` : 'Apagado'}</small><input type="range" min="0" max="100" value="${t.volume}" data-tv-volume="${esc(t.id)}" aria-label="Volumen de ${esc(t.name)}"></div><button class="round ${t.on ? 'on' : ''}" data-tv="${esc(t.id)}" aria-label="Encender o apagar">⏻</button></div>`).join('')}` : ''}
   ${!lights.length && !acs.length && !tvs.length ? '<p class="empty">No hay equipos en este espacio.</p>' : ''}`;
  bind();
}

async function act(name, args, message) {
  try { await call(name, args); if (message) toast(message); } catch (error) { toast(error.message); }
  await refresh(true);
}

function bind() {
  document.querySelectorAll('[data-scene]').forEach(b => b.onclick = () => act('activate_scene', { scene: b.dataset.scene }, `Escena «${b.textContent}»`));
  document.querySelectorAll('[data-room]').forEach(b => b.onclick = () => { room = b.dataset.room; render(); });
  $('#all-off').onclick = async () => {
    const on = home.lights.filter(lit).map(l => l.id), acs = home.airConditioners.filter(a => a.on).map(a => a.id);
    if (on.length) await call('set_lights', { ids: on, on: false }).catch(e => toast(e.message));
    if (acs.length) await call('set_air_conditioners', { ids: acs, on: false }).catch(e => toast(e.message));
    toast(on.length || acs.length ? 'Todo apagado' : 'Ya estaba todo apagado');
    refresh(true);
  };
  // Luces: tocar enciende o apaga; arrastrar a los lados atenúa y se envía al soltar.
  document.querySelectorAll('[data-light]').forEach(tile => {
    const light = home.lights.find(l => l.id === tile.dataset.light);
    let start = null, level = null;
    tile.onpointerdown = e => { start = { x: e.clientX, level: lit(light) ? light.brightness : 0 }; level = null; };
    tile.onpointermove = e => {
      if (!start || Math.abs(e.clientX - start.x) < 8) return;
      busy = true; tile.setPointerCapture?.(e.pointerId);
      level = Math.max(0, Math.min(100, Math.round(start.level + (e.clientX - start.x) / tile.offsetWidth * 100)));
      tile.style.setProperty('--level', level / 100); tile.querySelector('span').textContent = level ? `${level}%` : 'Apagada';
    };
    tile.onpointerup = () => {
      if (!start) return;
      const dragged = level !== null; start = null; busy = false;
      if (dragged) act('set_lights', level ? { ids: [light.id], brightness: level, on: true } : { ids: [light.id], on: false });
      else act('set_lights', { ids: [light.id], on: !lit(light), ...(lit(light) ? {} : { brightness: light.brightness || 100 }) });
    };
    tile.onpointercancel = () => { start = null; busy = false; render(); };
  });
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const a = home.airConditioners.find(x => x.id === b.dataset.ac); act('set_air_conditioners', { ids: [a.id], on: true, target: a.target + Number(b.dataset.step) }); });
  document.querySelectorAll('[data-ac-power]').forEach(b => b.onclick = () => { const a = home.airConditioners.find(x => x.id === b.dataset.acPower); act('set_air_conditioners', { ids: [a.id], on: !a.on }); });
  document.querySelectorAll('[data-tv]').forEach(b => b.onclick = () => { const t = home.tvs.find(x => x.id === b.dataset.tv); act('set_tvs', { ids: [t.id], on: !t.on }); });
  document.querySelectorAll('[data-tv-volume]').forEach(r => { r.oninput = () => { busy = true; }; r.onchange = () => { busy = false; act('set_tvs', { ids: [r.dataset.tvVolume], volume: Number(r.value) }); }; });
}

refresh(true);
setInterval(() => { if (!document.hidden) refresh(); }, 2000);
setInterval(() => { if (!document.hidden) loadPicture(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
</script>
</body>
</html>
